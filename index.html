<style>
:root{--bg:#f6f1e7;--card:#fffdf8;--ink:#1f2a44;--sub:#5d667c;--line:#e4dccb;--gold:#b0822a;--gold2:#f3e6c8;--navy:#1f2a44;--ok:#2f7d4f;--okbg:#e2f1e7;--warn:#a5482d;--warnbg:#f8e5de;--chip:#ece5d5;--shadow:0 1px 3px rgba(31,42,68,.08)}
@media (prefers-color-scheme:dark){:root{--bg:#141926;--card:#1d2435;--ink:#ece7da;--sub:#a3abbd;--line:#2f3850;--gold:#d9ad55;--gold2:#3a3220;--navy:#0f1420;--ok:#6cc08e;--okbg:#1d3528;--warn:#e58c70;--warnbg:#3d241d;--chip:#2a3247;--shadow:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:16px;line-height:1.65}
body{padding-bottom:calc(72px + env(safe-area-inset-bottom))}
header.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#f4ecd8;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}

header.top h1{font-size:17px;margin:0;font-weight:700;flex:1}
header.top .wk{font-size:12px;background:rgba(255,255,255,.12);padding:3px 9px;border-radius:99px;white-space:nowrap}
main{max-width:720px;margin:0 auto;padding:14px 16px 24px}
h2{font-size:19px;margin:18px 0 8px}
h3{font-size:16px;margin:14px 0 6px}
p{margin:6px 0}
.sub{color:var(--sub);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0;box-shadow:var(--shadow)}
.card.hero{background:var(--navy);color:#f4ecd8;border:none}
.card.hero .sub{color:#c9c2ad}
.card.hero .verse{border-left:3px solid #b0822a;color:#e9dfc4}
.verse{border-left:3px solid var(--gold);padding:4px 0 4px 12px;margin:10px 0;color:var(--sub);font-size:15px}
.verse b{display:block;font-weight:600;font-size:13px;margin-top:2px}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.chip{display:inline-block;background:var(--chip);color:var(--ink);font-size:12px;padding:2px 9px;border-radius:99px;margin:0 4px 4px 0;white-space:nowrap}
.chip.gold{background:var(--gold2);color:var(--gold)}
.chip.ok{background:var(--okbg);color:var(--ok)}
.chip.warn{background:var(--warnbg);color:var(--warn)}
button,.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:11px;padding:10px 14px;cursor:pointer;min-height:44px}
button.pri{background:var(--gold);border-color:var(--gold);color:#fff;font-weight:700}
button.navy{background:var(--navy);border-color:var(--navy);color:#f4ecd8;font-weight:600}
button.ghost{background:transparent}
button.sm{min-height:34px;padding:5px 11px;font-size:14px;border-radius:9px}
button.full{width:100%;margin-top:8px}
button:active{opacity:.75}
input[type=text],input[type=date],input[type=search],input[type=password],textarea,select{font:inherit;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:var(--bg);color:var(--ink);margin:4px 0 10px}
textarea{min-height:84px;resize:vertical}
label{font-size:14px;font-weight:600;color:var(--sub)}
ul,ol{padding-left:22px;margin:6px 0}
li{margin:3px 0}
.todo{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.todo:last-child{border-bottom:none}
.todo .dot{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:14px;flex:none;color:transparent}
.todo.done .dot{background:var(--ok);border-color:var(--ok);color:#fff}
.todo .t{flex:1;min-width:0}
.todo .t small{display:block;color:var(--sub);font-size:13px}
.todo .go{color:var(--sub)}
.lamps{display:flex;justify-content:space-between;gap:6px;margin-top:8px}
.lamp{flex:1;text-align:center;font-size:12px;color:var(--sub)}
.lamp i{display:block;width:34px;height:34px;border-radius:50%;margin:0 auto 4px;background:var(--chip);border:2px solid var(--line)}
.lamp.on i{background:radial-gradient(circle at 35% 30%,#ffe9a8,#e0a83a);border-color:#e0a83a;box-shadow:0 0 12px rgba(224,168,58,.55)}
.lamp.on{color:var(--ink);font-weight:600}
.rel{display:grid;grid-template-columns:72px 1fr;gap:4px 10px;font-size:15px}
.rel span:nth-child(odd){color:var(--sub);font-size:13px;padding-top:2px}
.list-item{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.list-item:last-child{border-bottom:none}
.list-item .n{width:30px;height:30px;border-radius:9px;background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex:none}
.list-item.done .n{background:var(--okbg);color:var(--ok)}
.seg{display:flex;background:var(--chip);border-radius:11px;padding:3px;margin:8px 0}
.seg button{flex:1;border:none;background:transparent;min-height:36px;padding:4px;font-size:14px;border-radius:9px}
.seg button.on{background:var(--card);font-weight:700;box-shadow:var(--shadow)}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--gold);font-weight:600;background:none;border:none;padding:6px 0;min-height:36px}
details{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:8px 0;overflow:hidden}
details summary{padding:13px 14px;font-weight:700;cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"＋";margin-left:auto;color:var(--gold)}
details[open] summary::after{content:"－"}
details .body{padding:0 14px 14px}
.tbl{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
.tbl th{color:var(--sub);font-size:12px;font-weight:600}
.scroll{overflow-x:auto}
.org{display:flex;flex-direction:column;align-items:center;gap:0}
.org .box{width:100%;max-width:340px;border:1px solid var(--line);border-radius:12px;padding:9px 12px;text-align:center;background:var(--card)}
.org .box.me{border:2px solid var(--gold);background:var(--gold2)}
.org .box.king{background:var(--navy);color:#f4ecd8;border:none}
.org .box small{display:block;color:var(--sub);font-size:12px}
.org .box.king small{color:#c9c2ad}
.org .arr{color:var(--gold);font-size:14px;line-height:1.2}
.org .four{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;width:100%;max-width:340px;margin-top:5px}
.org .four span{font-size:11px;background:var(--chip);border-radius:8px;padding:4px 2px;text-align:center}
.code{font-size:34px;letter-spacing:8px;font-weight:800;text-align:center;color:var(--gold);font-variant-numeric:tabular-nums}
.fruit{display:grid;grid-template-columns:48px 1fr 22px;gap:8px;align-items:center;margin:4px 0;font-size:15px}
input[type=range]{width:100%;accent-color:var(--gold)}
.q{margin:12px 0;padding-bottom:10px;border-bottom:1px dashed var(--line)}
.q:last-of-type{border-bottom:none}
.opt{display:flex;gap:8px;align-items:flex-start;padding:7px 8px;border-radius:9px;cursor:pointer}
.opt input{margin-top:6px;accent-color:var(--gold)}
.opt.right{background:var(--okbg)}
.opt.wrong{background:var(--warnbg)}
.exp{font-size:14px;color:var(--sub);margin:4px 0 0 8px}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--navy);color:#fff;padding:9px 16px;border-radius:99px;font-size:14px;z-index:50;box-shadow:0 4px 14px rgba(0,0,0,.25);max-width:88vw;text-align:center}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;border:none;background:none;border-radius:0;padding:7px 2px 6px;font-size:11px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:1px;min-height:58px}
nav.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--gold);font-weight:700}
.role-pick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0}
.role-pick button{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:2px;min-height:76px}
.role-pick button.on{border:2px solid var(--gold);background:var(--gold2)}
.role-pick small{color:var(--sub);font-size:12px}
.scn{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.scn button{text-align:left;font-size:14px;min-height:52px}
.hit{padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.hit b{display:block}
.hit span{font-size:13px;color:var(--sub)}
mark{background:var(--gold2);color:inherit;border-radius:3px}
pre.out{white-space:pre-wrap;word-break:break-all;background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:10px;font-size:13px;max-height:240px;overflow:auto;font-family:inherit}
.bar{height:8px;background:var(--chip);border-radius:99px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--gold);border-radius:99px}
.center{text-align:center}
.mt{margin-top:12px}
</style>
</head>
<body>
<div id="root"></div>
<script>
'use strict';

var INFO = [
{ id: 'vision', t: '異象與使命', h: '<p>321學神院不是「學神學」的學校，而是「學神」的家：學習神、像神、活出神的形像和樣式。<b>院長是主耶穌基督</b>，真理的聖靈是親自授課的老師，所有同工都只是助教。</p><div class="verse">你們要先求他的國和他的義，這些東西都要加給你們了。<b>馬太福音六章33節</b></div><p><b>異象</b>：活出基督，成為得勝者，發展螞蟻戰略，建立神國。</p><p><b>使命</b>：培訓國度家人成為螞蟻奇兵，被聖靈充滿，活出基督無己的生命，建立螞蟻家教會，邁進末後的大復興，迎接主耶穌再來。</p><p><b>五大學習課程</b>：321聖經講義、321學神神學、321理念、生活操練、服事技能。</p><p><b>三條原則</b></p><ul><li>先生命、再關係、後事工：評量先看生命，再看關係，最後才看課業。</li><li>人比事重要，關係比東西重要：缺席先關懷、後補課。</li><li>改變從我開始：每一項評量都是自我評量，焦點在耶穌。</li></ul>' },
{ id: 'org', t: '組織架構與屬靈次序', h: '<p>學神院的架構是「倒金字塔」：越在上面的人，越是在下面托住眾人的僕人。次序不是階級，而是本位。</p><div class="verse">你們中間誰願為大，就必作你們的用人；誰願為首，就必作你們的僕人。<b>馬太福音二十章26至27節</b></div>__ORG__<p class="sub">由上而下是「遮蓋、供應、服事」；由下而上是「回報、問責、代禱」。</p><h3>235 互助學習小組</h3><div class="scroll"><table class="tbl"><tr><th>單位</th><th>關係</th><th>功用</th></tr><tr><td>2 屬靈同伴</td><td>彼此陪伴、彼此問責</td><td>每週互相確認作業與生活操練</td></tr><tr><td>3 屬靈家庭</td><td>屬靈父母與兒女</td><td>老學員帶新學員，生命傳承</td></tr><tr><td>5 屬靈戰友</td><td>五重職份團隊</td><td>一起上課、討論、服事、繁殖新小組</td></tr></table></div><ul><li>一個小組以 5 人為標準（3 至 7 人皆可），滿 8 人即預備繁殖為兩組。</li><li>一位助教照管 3 至 5 組；一位負責人同工照管 3 至 5 位助教。</li><li>跨國跨時區編組，以「可共同上線的時段」為第一考量。</li></ul><p><b>關係的次序</b>：先與神，再與自己，再與人，最後與事。</p>' },
{ id: 'roles', t: '四種角色的定位與職責', h: '__ROLES__' },
{ id: 'rules', t: '規章制度（八章）', h: '<div class="verse">凡事都要規規矩矩地按著次序行。<b>哥林多前書十四章40節</b></div><p class="sub">規章像葡萄架，不是為了捆綁枝子，而是托住枝子往上長、結果子。</p><h3>第一章　入學</h3><ol><li>資格：重生得救、認同321理念、願意被陪伴也願意陪伴人。</li><li>流程：報名表 → 推薦人確認 → 面試 → 錄取通知 → 簽署學員約定 → 領取 App 與編組。</li><li>面試看三件事：生命（得救見證）、心志（為何而學）、時間（能否穩定投入）。</li></ol><h3>第二章　學籍</h3><ol><li>狀態分五種：預備生、正式學員、休學、結業、退學。</li><li>新生前 4 週為預備期，出席達 3 次以上轉為正式學員。</li><li>因故可申請休學一個學期，復學時重新編組。</li></ol><h3>第三章　出席與請假</h3><ol><li>每週小組聚會為必要出席；出席率達 80% 方得該學期學分。</li><li>請假須於聚會前告知組長，並於 7 天內看完課程、與同伴補討論，即視為「補課出席」。</li><li>連續 2 週無故缺席，組長關懷並回報助教；連續 4 週，由助教約談，商議休學或調組。先關心人，再處理事。</li></ol><h3>第四章　作業與測驗</h3><ol><li>作業於下次聚會前繳交；遲交可補，但須在學期結束前完成。</li><li>測驗為自我評量，可重複作答，取最高分；70 分為通過。</li><li>作業重在「真實」不在「漂亮」：寫自己的看見、自己的問題、自己的改變。</li></ol><h3>第五章　陪伴與問責</h3><ol><li>每位學員必有一位 2 同伴，每週至少聯絡一次，互問四句。</li><li>問責的態度是謙卑對謙卑：只問自己的問題，不指責對方的問題。</li></ol><h3>第六章　團契生活公約</h3><ol><li>保密：小組中的個人分享不外傳。</li><li>不論斷、不教導、不爭辯：分享時用「我」開頭，不用「你應該」。</li><li>不在小組中推銷、借貸、拉政治立場；不傳與純正福音信仰相違的教導。</li></ol><h3>第七章　勸戒與挑戰處理</h3><p>按馬太福音十八章15至17節的次序：當事人私下溝通 → 組長協助 → 助教介入 → 負責人團隊裁定。每一步的目的都是挽回，不是懲罰。</p><h3>第八章　結業與差派</h3><ol><li>結業條件：修滿必修與選修學分、出席達標、完成結業見證、經組長與助教推薦。</li><li>建議門檻：兩年六學期，必修 24、選修 4、自修 2，合計 30 學分。</li><li>結業不是終點，是差派：成為組長、建立新的 235、開拓螞蟻家教會。</li><li>成長階梯：學員 → 副組長 → 組長 → 助教 → 負責人同工。</li></ol>' },
{ id: 'modes', t: '必修、選修、自修', h: '<div class="scroll"><table class="tbl"><tr><th>方式</th><th>怎麼上</th><th>評量</th><th>學分</th></tr><tr><td><b>必修</b></td><td>235 小組每週一起看課、討論、分享</td><td>簽到＋作業＋測驗＋同伴問責</td><td>每門 2</td></tr><tr><td><b>選修</b></td><td>依恩賜與負擔自選，另組學習圈或在原小組加選</td><td>作業＋測驗</td><td>每門 1</td></tr><tr><td><b>自修</b></td><td>個人在 App 內依自己步調學習</td><td>測驗＋一句話心得</td><td>每門 0.5</td></tr></table></div><p>每學期必修 2 門（一門「知」：聖經或神學；一門「行」：理念、操練或技能），選修至多 1 門，自修不限。</p><p><b>每一課的固定結構</b>對應改變觀念八步驟：資訊（看課）→ 啟示（安靜尋求）→ 信服（討論分享）→ 實踐（本週行動）→ 檢討（同伴問責）→ 修正 → 反覆 → 繁殖（教給另一個人）。</p>' },
{ id: 'flow', t: '每週聚會流程（約 90 分鐘）', h: '<div class="verse">只是你們要行道，不要單單聽道，自己欺哄自己。<b>雅各書一章22節</b></div>__FLOW__<p><b>一週節奏</b>：聚會前自修預習 → 聚會日簽到、看課、討論 → 聚會後 2 天內交作業、做測驗 → 週間操練 920、同伴問責一次 → 下次聚會前送出個人週報。</p><p class="sub">組長小提醒：用心靠聖靈，不用腦靠自己；少講多問，讓每個人都開口；沉默不可怕，那可能是聖靈正在工作。</p>' },
{ id: 'assess', t: '自我評量與五盞燈', h: '<div class="verse">你們總要自己省察有信心沒有，也要自己試驗。<b>哥林多後書十三章5節</b></div><p>評量是一面鏡子，不是一把尺。全部評量只給本人與陪伴者看，不公開、不排名，只與「昨天的自己」比。</p><div class="scroll"><table class="tbl"><tr><th>燈</th><th>面向</th><th>怎麼做</th><th>亮燈標準</th></tr><tr><td>920 自省</td><td>生命</td><td>九果各 1 至 5 分自評＋本週「有己」醒來的時刻</td><td>八成週次有填</td></tr><tr><td>同伴問責</td><td>關係</td><td>與 2 同伴互問四句</td><td>八成週次完成</td></tr><tr><td>簽到</td><td>事工</td><td>聚會中輸入當週簽到碼；補課者輸入補課碼</td><td>出席率 80%</td></tr><tr><td>作業</td><td>事工</td><td>三段式：我的看見、我的問題、我的行動</td><td>必修作業完成八成</td></tr><tr><td>測驗</td><td>事工</td><td>每課測驗，答後顯示解析，可重測</td><td>必修測驗通過八成</td></tr></table></div><p>五盞全亮即得該學期學分；未亮的燈就是下學期的成長方向。</p>' },
{ id: 'report', t: '互動與回報機制', h: '<p>回報像身體的血液循環：週報由下往上送，關懷與供應由上往下流。有回報必有回應，這是對人的尊重。</p><div class="scroll"><table class="tbl"><tr><th>週報</th><th>誰產生</th><th>傳給誰</th><th>何時</th></tr><tr><td>個人週報</td><td>學員</td><td>組長</td><td>聚會前</td></tr><tr><td>小組週報</td><td>組長</td><td>助教</td><td>聚會後 2 天內</td></tr><tr><td>助教週報</td><td>助教</td><td>負責人團隊</td><td>每週日</td></tr></table></div><p>App 會一鍵產生「給人讀的文字」加「一行代碼」。上一級把整段貼進 App，就自動彙整成表。920 分數、有己時刻與作業全文屬個人隱私，不會進入週報。</p><h3>會議與陪伴節奏</h3><ul><li>每週：小組聚會、2 人同伴問責</li><li>每月：助教與組長一對一、助教月會、負責人會議</li><li>每學期：開學立約、期末感恩見證會、同工退修</li><li>每年：結業與差派禮、規章與課程檢討</li></ul>' },
{ id: 'help', t: '遇到問題找誰（求助次序）', h: '<div class="scroll"><table class="tbl"><tr><th>問題</th><th>第一步</th><th>第二步</th><th>第三步</th></tr><tr><td>課程內容不懂</td><td>同伴與小組討論</td><td>組長</td><td>助教 → 教務組</td></tr><tr><td>App 操作</td><td>資料中心常見問題</td><td>組長</td><td>資訊組</td></tr><tr><td>請假補課</td><td>組長</td><td>助教</td><td>學務組</td></tr><tr><td>個人與家庭困難</td><td>同伴代禱</td><td>組長</td><td>助教 → 關懷組</td></tr><tr><td>人際衝突</td><td>當事人私下溝通</td><td>組長</td><td>助教 → 負責人團隊</td></tr></table></div><p>原則：逐級而上、不越級、不繞道；唯有緊急危難（人身安全、重大變故）可直接聯絡關懷組。</p><p><b>負責人團隊四組分工</b>：教務組（課程、作業、測驗）、學務組（招生、面試、學籍、編組）、關懷組（牧養、禱告、危機關懷）、資訊組（App、資料中心、身分碼）。</p>' },

var KEY = 'xsy321-v1', MEM = null;
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function fnv(str) { var h = 0x811c9dc5; str = unescape(encodeURIComponent('321|' + str)); for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = (h + ((h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24))) >>> 0; } return ('0000000' + h.toString(16)).slice(-8); }
function load() { try { var t = localStorage.getItem(KEY); if (t) return JSON.parse(t); } catch (e) { } return MEM; }
function save() { MEM = S; try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { } }
function blank() { return { profile: null, enroll: {}, lessons: {}, sign: {}, exam: {}, acct: {}, action: {}, agg: { P: {}, G: {}, T: {} }, roster: '', hi: {}, taNote: {} }; }

['enroll', 'lessons', 'sign', 'exam', 'acct', 'action', 'hi', 'taNote'].forEach(function (k) { if (!S[k]) S[k] = {}; });

function toast(m) { var o = document.querySelector('.toast'); if (o) o.remove(); var d = document.createElement('div'); d.className = 'toast'; d.textContent = m; document.body.appendChild(d); clearTimeout(toastT); toastT = setTimeout(function () { d.remove(); }, 2400); }
function enc(o) { return '#321R1:' + btoa(unescape(encodeURIComponent(JSON.stringify(o)))); }
function decAll(text) { var out = [], re = /#321R1:([A-Za-z0-9+\/=]+)/g, m; while ((m = re.exec(text))) { try { out.push(JSON.parse(decodeURIComponent(escape(atob(m[1]))))); } catch (e) { } } return out; }
function share(text) {
  if (navigator.share) { navigator.share({ text: text }).catch(function () { }); return; }

/* ===================== 學期與週次 ===================== */
function termStart() { return (S.profile && S.profile.termStart) || CONFIG.termStart; }
function pd(s) { var a = s.split('-'); return new Date(+a[0], +a[1] - 1, +a[2]); }
function rawWeek() { return Math.floor((new Date() - pd(termStart())) / 6048e5) + 1; }
function curWeek() { return Math.max(1, Math.min(CONFIG.weeks, rawWeek())); }
function weekLabel() { var r = rawWeek(); if (r < 1) return '尚未開學'; if (r > CONFIG.weeks) return '學期已結束'; return '第 ' + r + ' 週'; }
function weekDates(w) { var d = pd(termStart()); d.setDate(d.getDate() + (w - 1) * 7); var e = new Date(d); e.setDate(e.getDate() + 6); return (d.getMonth() + 1) + '/' + d.getDate() + '–' + (e.getMonth() + 1) + '/' + e.getDate(); }
function lessonOfWeek(w) { return (w >= 2 && w <= 11) ? w - 2 : -1; }
function grp() { return ((S.profile && S.profile.group) || '').toUpperCase().replace(/\s/g, ''); }
function signCode(w, kind) { var n = parseInt(fnv(grp() + '|' + termStart() + '|' + w + '|' + kind), 16) % 10000; return ('000' + n).slice(-4); }
function rank() { return S.profile ? ROLES[S.profile.role].rank : 0; }

/* ===================== 課程狀態 ===================== */
function course(id) { for (var i = 0; i < COURSES.length; i++) if (COURSES[i].id === id) return COURSES[i]; }
function LS(cid, i) { var k = cid + '-' + i; if (!S.lessons[k]) S.lessons[k] = {}; return S.lessons[k]; }
function LSr(cid, i) { return S.lessons[cid + '-' + i] || {}; }
function enrolled(c) { return c.mode === 'req' || !!S.enroll[c.id]; }
function hwDone(c, i) { var l = LSr(c.id, i); if (c.mode === 'self') return !!(l.note && l.note.length >= 5); var h = l.hw; return !!(h && h.done); }
function quizDone(c, i) { var les = c.lessons[i]; if (!les.quiz) return true; var l = LSr(c.id, i); return (l.best || 0) >= CONFIG.passScore; }
function lessonDone(c, i) { var l = LSr(c.id, i); return !!l.read && hwDone(c, i) && quizDone(c, i); }
function courseProg(c) { var n = 0; for (var i = 0; i < c.lessons.length; i++) if (lessonDone(c, i)) n++; return n; }
function credits() { var r = { req: 0, elec: 0, self: 0 }; COURSES.forEach(function (c) { if (courseProg(c) === c.lessons.length) r[c.mode] += c.credit; }); return r; }

function weekStatus(w) {

  var sg = S.sign[w];
  return { exam: !!S.exam[w], acct: !!(S.acct[w] && S.acct[w].done), sign: !!(sg && (sg.st === '出席' || sg.st === '補課')), hw: hw, quiz: qz, hasLesson: li >= 0 };
}
function lamps() {

  var r = CONFIG.attendRate;

  h += '<h3>角色手冊</h3>' + HANDBOOKS.map(function (b) { var ok = ROLES[b.role].rank <= rk || b.role === 'student'; return '<details id="hb-' + b.role + '"' + op('hb-' + b.role) + '><summary>' + b.t + (ok ? '' : '　🔒') + '</summary><div class="body">' + (ok ? b.h : lockNote(b.role)) + '</div></details>'; }).join('');
  h += '<h3>表單範本</h3><details id="forms"' + op('forms') + '><summary>表單（點按鈕即可複製）</summary><div class="body">' + FORMS.map(function (f, i) { var ok = ROLES[f.role].rank <= rk; return '<div class="row" style="padding:6px 0"><div class="grow">' + f.t + (ok ? '' : '　🔒 ' + ROLES[f.role].name) + '</div>' + (ok ? '<button class="sm" data-a="copyForm" data-i="' + i + '">複製</button>' : '') + '</div>'; }).join('') + '</div></details>';
  h += '<h3>速查</h3><details id="glossary"' + op('glossary') + '><summary>321理念名詞速查</summary><div class="body">' + GLOSSARY.map(function (g) { return '<p><b>' + g[0] + '</b>：' + g[1] + '</p>'; }).join('') + '</div></details>';
  h += '<details id="faq"' + op('faq') + '><summary>常見問題</summary><div class="body">' + FAQ.map(function (f) { return '<p><b>問：' + f[0] + '</b><br>答：' + f[1] + '</p>'; }).join('') + '</div></details>';
  var lk = Object.keys(CONFIG.links).filter(function (k) { return CONFIG.links[k]; });
  if (lk.length) h += '<details><summary>相關學習 App</summary><div class="body">' + lk.map(function (k) { return '<p><a href="' + esc(CONFIG.links[k]) + '" target="_blank" rel="noopener">' + esc(k) + '</a></p>'; }).join('') + '</div></details>';
  var p = S.profile;
  h += '<h3>設定與備份</h3><details id="settings"' + op('settings') + '><summary>我的資料與學期</summary><div class="body"><label>姓名</label><input type="text" id="s-name" value="' + esc(p.name) + '"><label>小組代碼</label><input type="text" id="s-group" value="' + esc(p.group || '') + '"><label>我的 2 同伴</label><input type="text" id="s-partner" value="' + esc(p.partner || '') + '"><label>我的組長</label><input type="text" id="s-leader" value="' + esc(p.leader || '') + '"><label>我的助教</label><input type="text" id="s-ta" value="' + esc(p.ta || '') + '"><label>學期開始日（第 1 週的星期一）</label><input type="date" id="s-term" value="' + esc(termStart()) + '"><button class="pri full" data-a="saveProfile">儲存</button></div></details>';
  h += '<details id="role"' + op('role') + '><summary>變更角色（目前：' + ROLES[p.role].name + '）</summary><div class="body">' + rolePick(V.obRole) + '<label>身分碼（學員免填）</label><input type="password" id="ob-code" autocomplete="off"><button class="navy full" data-a="changeRole">變更角色</button></div></details>';
  h += '<details id="backup"' + op('backup') + '><summary>備份與還原</summary><div class="body"><p class="sub">資料只存在這支手機。換手機前請匯出備份，傳給自己保存。</p><button class="full" data-a="exportBk">匯出備份（複製）</button><textarea id="bk" placeholder="把備份文字貼在這裡"></textarea><button class="full" data-a="importBk">匯入備份</button><button class="full" style="color:var(--warn)" data-a="reset">清除本機全部資料</button></div></details>';
  if (rk >= 3) h += '<details><summary>身分碼雜湊產生器（資訊組）</summary><div class="body"><p class="sub">輸入新的身分碼，把產生的雜湊值貼到程式碼 CONFIG.codes，再發布新版。</p><input type="text" id="hg" placeholder="新的身分碼"><button class="full" data-a="hashGen">產生雜湊</button><pre class="out" id="hg-out"></pre></div></details>';
  return h + '<p class="sub center mt">321學神院 App v' + CONFIG.version + '<br>願人都尊主的名為聖</p>';
}

/* ===================== 主畫面 ===================== */
var ICONS = { home: '<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><circle cx="12" cy="14" r="2"/>', course: '<path d="M4 5a2 2 0 012-2h13v16H6a2 2 0 00-2 2z"/><path d="M4 21V5"/><path d="M9 8h6"/>', group: '<circle cx="8" cy="9" r="3"/><circle cx="17" cy="10" r="2.4"/><path d="M2.5 20c.5-3.5 2.7-5.5 5.5-5.5s5 2 5.5 5.5"/><path d="M15 15c3 0 5 1.6 5.6 4.5"/>', info: '<path d="M3 10l9-6 9 6"/><path d="M5 10v9M9.5 10v9M14.5 10v9M19 10v9"/><path d="M3 20h18"/>', data: '<circle cx="11" cy="11" r="6.5"/><path d="M16 16l5 5"/>' };
var TABS = [['home', '我的位置'], ['course', '課程'], ['group', '小組'], ['info', '學神院'], ['data', '資料中心']];
function render() {
  var root = $('root');
  if (!S.profile) { root.innerHTML = renderOnboard(); return; }
  var body = { home: renderHome, course: renderCourses, group: renderGroup, info: renderInfo, data: renderData }[V.tab]();
  root.innerHTML = '<header class="top"><div class="logo">321</div><h1>321學神院</h1><span class="wk">' + weekLabel() + '</span></header><main>' + body + '</main><nav class="tabs">' + TABS.map(function (t) { return '<button data-a="tab" data-t="' + t[0] + '" class="' + (V.tab === t[0] ? 'on' : '') + '"><svg viewBox="0 0 24 24">' + ICONS[t[0]] + '</svg>' + t[1] + '</button>'; }).join('') + '</nav>';
  document.querySelectorAll('textarea[data-cnt]').forEach(updCnt);
  if (V.open && (V.tab === 'info' || V.tab === 'data')) { var el = $(V.tab === 'info' ? 'info-' + V.open : V.open); if (el) setTimeout(function () { el.scrollIntoView({ block: 'start' }); window.scrollBy(0, -64); }, 30); }
  else window.scrollTo(0, 0);
}
function updCnt(t) { var o = $(t.getAttribute('data-cnt')); if (o) { var n = cnt(t.value); o.textContent = '（' + n + ' 字' + (n < 30 ? '，還差 ' + (30 - n) : ' ✓') + '）'; } }
function go(to) {
  var a = to.split(':'); V.quizRes = null; V.open = null; V.sub = null;
  if (a[0] === 'lesson') { V.tab = 'course'; V.sub = 'lesson'; V.cid = a[1]; V.li = +a[2]; }
  else if (a[0] === 'course') { V.tab = 'course'; V.sub = 'course'; V.cid = a[1]; }
  else if (a[0] === 'group') { V.tab = 'group'; V.sub = a[1] || null; V.rw = null; }
  else { V.tab = a[0]; V.open = a[1] || null; }
  render();
}
function checkCode(role, code) { return role === 'student' || fnv(code.trim().toUpperCase()) === CONFIG.codes[role]; }
function now() { var d = new Date(); return d.getFullYear() + '/' + (d.getMonth() + 1) + '/' + d.getDate() + ' ' + ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }

var ACT = {
  tab: function (d) { V.tab = d.t; V.sub = null; V.open = null; V.quizRes = null; V.rw = null; render(); },
  go: function (d) { go(d.to); },
  back: function () { V.sub = null; V.rw = null; render(); },
  backCourse: function () { V.sub = 'course'; render(); },
  backLesson: function () { V.sub = 'lesson'; V.quizRes = null; render(); },
  mode: function (d) { V.mode = d.m; render(); },
  course: function (d) { V.cid = d.c; V.sub = 'course'; render(); },
  lesson: function (d) { V.cid = d.c; V.li = +d.i; V.sub = 'lesson'; render(); },
  obRole: function (d) { V.obName = val('ob-name') || V.obName; V.obGroup = val('ob-group') || V.obGroup; V.obRole = d.r; if (S.profile) V.open = 'role'; render(); },
  obDone: function () {
    var n = val('ob-name'); if (!n) return toast('請輸入姓名');
    if (!checkCode(V.obRole, val('ob-code'))) return toast('身分碼不正確，請向上一級同工確認');
    S.profile = { name: n, role: V.obRole, group: val('ob-group'), partner: '', leader: '', ta: '' }; save(); V.tab = 'home'; render(); toast('歡迎，' + n);
  },
  changeRole: function () { if (!checkCode(V.obRole, val('ob-code'))) return toast('身分碼不正確'); S.profile.role = V.obRole; save(); IDX = null; V.tab = 'home'; V.open = null; render(); toast('角色已變更為' + ROLES[V.obRole].name); },
  enroll: function (d) { S.enroll[d.c] = !S.enroll[d.c]; save(); render(); },
  read: function () { var l = LS(V.cid, V.li); l.read = !l.read; save(); render(); },
  saveNote: function () { LS(V.cid, V.li).note = val('note'); save(); render(); toast('已儲存'); },
  saveHw: function (d) {
    var hw = { see: val('hw-see'), prob: val('hw-prob'), act: val('hw-act') }, l = LS(V.cid, V.li);
    if (d.d === '1') { if (cnt(hw.see) < 30 || cnt(hw.prob) < 30 || cnt(hw.act) < 30) { l.hw = Object.assign(l.hw || {}, hw); save(); return toast('每段至少 30 字，已先存成草稿'); } hw.done = true; hw.date = now().split(' ')[0]; }
    else { hw.done = !!(l.hw && l.hw.done); hw.date = l.hw && l.hw.date; }
    l.hw = hw; save(); render(); toast(d.d === '1' ? '作業已繳交，感謝主' : '草稿已儲存');
  },
  shareHw: function () { var c = course(V.cid), l = c.lessons[V.li], hw = LSr(V.cid, V.li).hw; share('【321學神院 作業】\n' + S.profile.name + '｜' + c.title + ' 第 ' + (V.li + 1) + ' 課 ' + l.t + '\n\n我的看見：\n' + hw.see + '\n\n我的問題：\n' + hw.prob + '\n\n我的行動：\n' + hw.act); },
  quiz: function () { V.sub = 'quiz'; V.quizRes = null; render(); },
  submitQuiz: function () {
    var qz = course(V.cid).lessons[V.li].quiz, ans = [], ok = 0;
    for (var i = 0; i < qz.length; i++) { var e = document.querySelector('input[name=q' + i + ']:checked'); if (!e) return toast('第 ' + (i + 1) + ' 題還沒作答'); ans.push(+e.value); if (+e.value === qz[i].a) ok++; }
    var score = Math.round(ok / qz.length * 100), l = LS(V.cid, V.li); l.best = Math.max(l.best || 0, score); l.tries = (l.tries || 0) + 1; save(); V.quizRes = { score: score, ans: ans }; render();
  },
  saveAction: function () { S.action[curWeek()] = val('action'); save(); toast('已儲存，記得告訴你的同伴'); },
  sign: function () { var c = val('sign-code'), w = curWeek(); if (!grp()) return toast('請先到設定填寫小組代碼'); var st = c === signCode(w, 'IN') ? '出席' : (c === signCode(w, 'MK') ? '補課' : null); if (!st) return toast('簽到碼不正確，請再確認'); S.sign[w] = { st: st, time: now() }; save(); render(); toast('簽到成功'); },
  leave: function () { S.sign[curWeek()] = { st: '請假', time: now() }; save(); render(); toast('已記為請假，7 天內補課可改記補課'); },
  unsign: function () { delete S.sign[curWeek()]; save(); render(); },
  saveExam: function () { var sc = []; for (var i = 0; i < 9; i++) sc.push(+$('fr' + i).value); S.exam[curWeek()] = { sc: sc, self: val('ex-self'), th: val('ex-th') }; save(); render(); toast('已完成本週自省'); },
  saveAcct: function () { S.acct[curWeek()] = { done: true, pray: val('ac-pray'), mine: val('ac-mine') }; save(); render(); toast('已完成本週問責'); },
  shareOut: function () { share($('out').textContent); },
  copyOut: function () { copy($('out').textContent); },
  importRep: function (d) { var arr = decAll(val('paste')).filter(function (o) { return o.t === d.k; }); if (!arr.length) return toast('找不到可辨識的週報代碼'); arr.forEach(function (o) { S.agg[d.k][o.w + '|' + (o.t === 'G' ? o.g : o.n)] = o; }); save(); render(); toast('已匯入 ' + arr.length + ' 份週報'); },
  saveRoster: function () { S.roster = $('roster').value; save(); render(); toast('名冊已儲存'); },
  groupRep: function () { var w = V.rw || curWeek(); S.hi[w] = val('hi'); save(); share(groupReport(w)); },
  taRep: function () { var w = V.rw || curWeek(); S.taNote[w] = { need: val('ta-need'), succ: val('ta-succ') }; save(); share(taReport(w)); },
  copyForm: function (d) { copy(FORMS[+d.i].x); },
  saveProfile: function () { var p = S.profile; p.name = val('s-name') || p.name; p.group = val('s-group'); p.partner = val('s-partner'); p.leader = val('s-leader'); p.ta = val('s-ta'); var t = val('s-term'); p.termStart = (t && t !== CONFIG.termStart) ? t : undefined; save(); V.open = null; V.tab = 'home'; render(); toast('已儲存'); },
  exportBk: function () { copy('#321BK:' + btoa(unescape(encodeURIComponent(JSON.stringify(S))))); },
  importBk: function () { var m = /#321BK:([A-Za-z0-9+\/=]+)/.exec(val('bk')); if (!m) return toast('找不到備份內容'); try { var o = JSON.parse(decodeURIComponent(escape(atob(m[1])))); if (!o.profile) throw 0; S = o; save(); location.reload(); } catch (e) { toast('備份內容無法讀取'); } },
  reset: function () { if (confirm('確定清除這支手機上的全部學習紀錄嗎？此動作無法復原。')) { S = blank(); save(); V = { tab: 'home', obRole: 'student', mode: 'all' }; render(); } },
  hashGen: function () { var c = val('hg'); $('hg-out').textContent = c ? '身分碼：' + c.toUpperCase() + '\n雜湊值：' + fnv(c.toUpperCase()) : ''; }
};
document.addEventListener('click', function (e) { var t = e.target.closest('[data-a]'); if (!t) return; var f = ACT[t.getAttribute('data-a')]; if (f) f(t.dataset, t); });
document.addEventListener('input', function (e) { var t = e.target; if (t.id === 'q') { V.q = t.value.trim(); $('hits').innerHTML = hits(V.q); } else if (t.dataset.out) $(t.dataset.out).textContent = t.value; else if (t.dataset.cnt) updCnt(t); });
document.addEventListener('change', function (e) { if (e.target.id === 'rw') { V.rw = +e.target.value; render(); } });
render();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(function () { });
</script>
